<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Addressing modes</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="430.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Effective address:  [ base + index*scale + disp ]</text><rect x="60" y="80" width="160" height="54" rx="9" ry="9" fill="#3E7CC0"/><text x="140.0" y="99.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="140.0" dy="0">base</tspan><tspan x="140.0" dy="16">rbx</tspan></text><text x="140.0" y="150" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">any GPR</text><text x="240" y="107" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="260" y="80" width="160" height="54" rx="9" ry="9" fill="#1F918C"/><text x="340.0" y="99.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="340.0" dy="0">index</tspan><tspan x="340.0" dy="16">rsi</tspan></text><text x="340.0" y="150" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">any GPR but rsp</text><text x="440" y="107" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="460" y="80" width="160" height="54" rx="9" ry="9" fill="#D9922B"/><text x="540.0" y="99.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="540.0" dy="0">scale</tspan><tspan x="540.0" dy="16">×4</tspan></text><text x="540.0" y="150" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">1 2 4 8</text><text x="640" y="107" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="660" y="80" width="160" height="54" rx="9" ry="9" fill="#6B7B94"/><text x="740.0" y="99.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="740.0" dy="0">disp</tspan><tspan x="740.0" dy="16">+16</tspan></text><text x="740.0" y="150" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">constant</text><rect x="260" y="200" width="340" height="44" rx="9" ry="9" fill="#55637A"/><text x="430.0" y="222.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="430.0" dy="0">→ one memory operand, computed by the CPU</tspan></text><text x="430.0" y="266" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">mov eax, [rbx + rsi*4 + 16] loads int element rsi of an array at rbx+16</text></svg>
