<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>GOT and PLT</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Lazy binding through the PLT and GOT</text><rect x="40" y="92" width="180" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="130.0" y="117.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="130.0" dy="0">call printf@plt</tspan></text><rect x="300" y="92" width="200" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="400.0" y="109.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">PLT stub</tspan><tspan x="400.0" dy="15">jmp *[GOT entry]</tspan></text><rect x="580" y="62" width="200" height="46" rx="9" ry="9" fill="#D9922B"/><text x="680.0" y="77.5" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="680.0" dy="0">GOT → resolver</tspan><tspan x="680.0" dy="15">(first call only)</tspan></text><rect x="580" y="132" width="200" height="46" rx="9" ry="9" fill="#1F918C"/><text x="680.0" y="147.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="680.0" dy="0">GOT → real printf</tspan><tspan x="680.0" dy="15">(after resolve)</tspan></text><line x1="220" y1="117" x2="300" y2="117" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><line x1="500" y1="110" x2="580" y2="85" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="500" y1="124" x2="580" y2="155" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="410.0" y="260" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">the first call jumps to the dynamic linker, which patches the GOT;</text><text x="410.0" y="278" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">every later call jumps straight to the resolved address</text></svg>
