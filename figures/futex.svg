<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Futex</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Futex: fast userspace path, kernel only on contention</text><rect x="60" y="90" width="300" height="90" rx="10" ry="10" fill="#1F918C"/><text x="210.0" y="113.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="210.0" dy="0">FAST PATH (no syscall)</tspan><tspan x="210.0" dy="22">atomic CAS on the futex word</tspan><tspan x="210.0" dy="22">0 → 1  : lock acquired</tspan></text><rect x="420" y="90" width="300" height="90" rx="10" ry="10" fill="#3E7CC0"/><text x="570.0" y="113.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="570.0" dy="0">SLOW PATH (contended)</tspan><tspan x="570.0" dy="22">FUTEX_WAIT: sleep if still locked</tspan><tspan x="570.0" dy="22">FUTEX_WAKE: wake a waiter</tspan></text><line x1="360" y1="135" x2="420" y2="135" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><text x="390" y="122" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="central">CAS fails</text><text x="390.0" y="284" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">word: 0=free, 1=locked, 2=locked+waiters · kernel keys waiters by physical address</text></svg>
