<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>cmp and jcc</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">cmp / test set the flags; jcc reads them</text><rect x="60" y="78" width="250" height="60" rx="9" ry="9" fill="#6B7B94"/><text x="185.0" y="92.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="185.0" dy="0">cmp rax, rbx</tspan><tspan x="185.0" dy="16">computes rax - rbx,</tspan><tspan x="185.0" dy="16">throws the result away</tspan></text><rect x="60" y="172" width="250" height="44" rx="9" ry="9" fill="#3E7CC0"/><text x="185.0" y="194.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="185.0" dy="0">sets ZF SF CF OF</tspan></text><line x1="185" y1="138" x2="185" y2="172" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><rect x="470" y="74" width="270" height="68" rx="9" ry="9" fill="#1F918C"/><text x="605.0" y="91.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="605.0" dy="0">je  → ZF=1     (equal)</tspan><tspan x="605.0" dy="17">jl  → SF≠OF     (signed &lt;)</tspan><tspan x="605.0" dy="17">jb  → CF=1     (unsigned &lt;)</tspan></text><rect x="470" y="172" width="270" height="44" rx="9" ry="9" fill="#55637A"/><text x="605.0" y="194.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="605.0" dy="0">jcc reads those flags</tspan></text><line x1="310" y1="194" x2="470" y2="194" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><text x="390" y="184" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">flags</text><text x="390.0" y="284" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">test does AND, cmp does SUB — neither writes its operands, they only set flags</text></svg>
