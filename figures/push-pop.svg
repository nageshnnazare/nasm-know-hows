<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>push and pop</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">push and pop move RSP by 8</text><rect x="300" y="70" width="200" height="40" rx="3" ry="3" fill="#6B7B94"/><text x="400.0" y="90.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">(older frames)</tspan></text><rect x="300" y="114" width="200" height="40" rx="3" ry="3" fill="#6B7B94"/><text x="400.0" y="134.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">return address</tspan></text><rect x="300" y="158" width="200" height="40" rx="3" ry="3" fill="#6B7B94"/><text x="400.0" y="178.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">saved rbp</tspan></text><rect x="300" y="202" width="200" height="40" rx="3" ry="3" fill="#6B7B94"/><text x="400.0" y="222.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">local var</tspan></text><rect x="300" y="246" width="200" height="40" rx="3" ry="3" fill="#3E7CC0"/><text x="400.0" y="266.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="400.0" dy="0">rax  ← just pushed</tspan></text><line x1="256" y1="266" x2="292" y2="266" stroke="#1F918C" stroke-width="2" marker-end="url(#ah-t)"/><text x="250" y="266" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="central">rsp</text><text x="516" y="90" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="central">high addr</text><text x="516" y="266" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="central">low addr</text><text x="390.0" y="314" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">push: rsp -= 8 then store  ·  pop: load then rsp += 8  ·  the stack grows downward</text></svg>
