<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Context switch</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="420.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">A context switch swaps register state via the kernel</text><rect x="40" y="92" width="180" height="62" rx="9" ry="9" fill="#3E7CC0"/><text x="130.0" y="115.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="130.0" dy="0">process A</tspan><tspan x="130.0" dy="15">running in CPU</tspan></text><rect x="300" y="64" width="230" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="415.0" y="81.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">save A's regs →</tspan><tspan x="415.0" dy="15">A's kernel stack / TSS</tspan></text><rect x="300" y="156" width="230" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="415.0" y="173.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">load B's regs ←</tspan><tspan x="415.0" dy="15">B's kernel stack / TSS</tspan></text><rect x="610" y="156" width="190" height="62" rx="9" ry="9" fill="#1F918C"/><text x="705.0" y="179.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="705.0" dy="0">process B</tspan><tspan x="705.0" dy="15">runs (switch_to)</tspan></text><line x1="220" y1="118" x2="300" y2="92" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="415" y1="114" x2="415" y2="156" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><line x1="530" y1="182" x2="610" y2="186" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="420.0" y="284" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">switching address spaces reloads CR3 and flushes non-global TLB entries</text></svg>
