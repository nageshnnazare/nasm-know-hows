<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>malloc paths</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">malloc(N): which path?</text><rect x="330" y="54" width="160" height="44" rx="9" ry="9" fill="#3E7CC0"/><text x="410.0" y="76.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="410.0" dy="0">malloc(N)</tspan></text><rect x="560" y="130" width="220" height="60" rx="9" ry="9" fill="#6B7B94"/><text x="670.0" y="145.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="670.0" dy="0">mmap() region</tspan><tspan x="670.0" dy="15">one VMA per alloc</tspan><tspan x="670.0" dy="15">munmap on free</tspan></text><line x1="430" y1="98" x2="620" y2="130" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><text x="560" y="112" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">N ≥ 128 KiB</text><rect x="40" y="130" width="240" height="60" rx="9" ry="9" fill="#1F918C"/><text x="160.0" y="152.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="160.0" dy="0">tcache (per-thread)</tspan><tspan x="160.0" dy="15">64 LIFO bins, lock-free</tspan></text><line x1="360" y1="98" x2="160" y2="130" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><text x="200" y="112" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">small &amp; cached</text><rect x="300" y="210" width="240" height="150" rx="9" ry="9" fill="#55637A"/><text x="420.0" y="230.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="420.0" dy="0">arena (brk-grown)</tspan><tspan x="420.0" dy="22"></tspan><tspan x="420.0" dy="22">fastbins</tspan><tspan x="420.0" dy="22">small / large bins</tspan><tspan x="420.0" dy="22">unsorted bin</tspan><tspan x="420.0" dy="22">top chunk (wilderness)</tspan></text><line x1="380" y1="98" x2="400" y2="210" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><text x="470" y="150" fill="#55637A" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">else lock arena</text><line x1="420" y1="360" x2="420" y2="384" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="420" y="392" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">sbrk / mmap when the top chunk is too small</text></svg>
