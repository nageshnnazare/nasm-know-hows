<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Stack frame</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="320.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">A single stack frame (System V x86-64 ABI)</text><rect x="180" y="56" width="300" height="46" rx="3" ry="3" fill="#55637A"/><text x="330.0" y="71.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">caller args 7,8,9…</tspan><tspan x="330.0" dy="15">first 6 in registers</tspan></text><rect x="180" y="107" width="300" height="40" rx="3" ry="3" fill="#3E7CC0"/><text x="330.0" y="119.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">return address</tspan><tspan x="330.0" dy="15">pushed by call</tspan></text><rect x="180" y="152" width="300" height="46" rx="3" ry="3" fill="#6B7B94"/><text x="330.0" y="167.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">saved RBP of caller</tspan><tspan x="330.0" dy="15">push %rbp  ← %rbp</tspan></text><rect x="180" y="203" width="300" height="40" rx="3" ry="3" fill="#55637A"/><text x="330.0" y="215.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">callee-saved regs</tspan><tspan x="330.0" dy="15">rbx, r12-r15 if used</tspan></text><rect x="180" y="248" width="300" height="60" rx="3" ry="3" fill="#6B7B94"/><text x="330.0" y="270.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">local variables</tspan><tspan x="330.0" dy="15">…</tspan></text><rect x="180" y="313" width="300" height="40" rx="3" ry="3" fill="#55637A"/><text x="330.0" y="325.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">alignment padding</tspan><tspan x="330.0" dy="15">16-byte aligned  ← %rsp</tspan></text><text x="166" y="68" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="end" dominant-baseline="central">higher</text><text x="166" y="338" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="end" dominant-baseline="central">lower</text><line x1="150" y1="80" x2="150" y2="334" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="320.0" y="444" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">stack grows downward; args in rdi,rsi,rdx,rcx,r8,r9; return in rax</text></svg>
