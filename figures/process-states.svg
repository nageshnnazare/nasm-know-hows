<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Process states</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="380.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Process state machine</text><rect x="300" y="66" width="160" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="380.0" y="91.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">RUNNING</tspan></text><rect x="80" y="182" width="160" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="160.0" y="207.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="160.0" dy="0">READY</tspan></text><rect x="520" y="182" width="160" height="50" rx="9" ry="9" fill="#D9922B"/><text x="600.0" y="207.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="600.0" dy="0">BLOCKED</tspan></text><rect x="300" y="256" width="160" height="46" rx="9" ry="9" fill="#55637A"/><text x="380.0" y="279.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">ZOMBIE</tspan></text><line x1="300" y1="108" x2="190" y2="182" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="212" y="138" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">preempt</text><line x1="210" y1="182" x2="320" y2="112" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="300" y="150" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">dispatch</text><line x1="430" y1="112" x2="560" y2="182" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="520" y="138" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">wait I/O</text><line x1="520" y1="214" x2="240" y2="214" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="380" y="226" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">I/O done → back to READY</text><line x1="380" y1="116" x2="380" y2="256" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="404" y="190" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">exit</text><text x="380.0" y="308" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">a blocked task wakes to READY, not straight to RUNNING — the scheduler chooses next</text></svg>
