<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Instruction format</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="450.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Anatomy of an x86-64 instruction</text><rect x="30" y="74" width="118" height="54" rx="9" ry="9" fill="#55637A"/><text x="89.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="89.0" dy="0">prefix</tspan><tspan x="89.0" dy="15">0-4 B</tspan></text><rect x="151" y="74" width="118" height="54" rx="9" ry="9" fill="#D9922B"/><text x="210.0" y="93.5" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="210.0" dy="0">REX</tspan><tspan x="210.0" dy="15">0-1 B</tspan></text><rect x="272" y="74" width="118" height="54" rx="9" ry="9" fill="#3E7CC0"/><text x="331.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="331.0" dy="0">opcode</tspan><tspan x="331.0" dy="15">1-3 B</tspan></text><rect x="393" y="74" width="118" height="54" rx="9" ry="9" fill="#1F918C"/><text x="452.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="452.0" dy="0">ModRM</tspan><tspan x="452.0" dy="15">0-1 B</tspan></text><rect x="514" y="74" width="118" height="54" rx="9" ry="9" fill="#1F918C"/><text x="573.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="573.0" dy="0">SIB</tspan><tspan x="573.0" dy="15">0-1 B</tspan></text><rect x="635" y="74" width="118" height="54" rx="9" ry="9" fill="#6B7B94"/><text x="694.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="694.0" dy="0">disp</tspan><tspan x="694.0" dy="15">0/1/2/4</tspan></text><rect x="756" y="74" width="118" height="54" rx="9" ry="9" fill="#6B7B94"/><text x="815.0" y="93.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="815.0" dy="0">imm</tspan><tspan x="815.0" dy="15">0/1/2/4/8</tspan></text><text x="450.0" y="162" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">only the opcode is mandatory; most instructions are 2–4 bytes</text><text x="450.0" y="234" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">mov [rdi+rsi*4+1], eax = REX + opcode + ModRM + SIB + disp8</text></svg>
