oe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="central">CR3 →</text><line x1="875" y1="206" x2="875" y2="246" stroke="#1F918C" stroke-width="2" marker-end="url(#ah-t)"/><rect x="810.0" y="246" width="130" height="46" rx="9" ry="9" fill="#1F918C"/><text x="875.0" y="262.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="875.0" dy="0">+ offset</tspan><tspan x="875.0" dy="14">→ phys addr</tspan></text><text x="500.0" y="330" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">a TLB miss can cost 4 extra memory accesses — hence the TLB</text></svg>
