<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Syscall path</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">A Linux syscall: user → kernel → back</text><rect x="60" y="78" width="270" height="68" rx="9" ry="9" fill="#3E7CC0"/><text x="195.0" y="96.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="195.0" dy="0">set rax = syscall number</tspan><tspan x="195.0" dy="16">args in rdi rsi rdx r10 r8 r9</tspan><tspan x="195.0" dy="16">execute  syscall</tspan></text><rect x="450" y="78" width="270" height="68" rx="9" ry="9" fill="#6B7B94"/><text x="585.0" y="96.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="585.0" dy="0">CPU enters ring 0 (MSR_LSTAR)</tspan><tspan x="585.0" dy="16">runs the sys_* handler</tspan><tspan x="585.0" dy="16">no IDT lookup</tspan></text><line x1="330" y1="100" x2="450" y2="100" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><text x="390" y="90" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">syscall</text><rect x="450" y="190" width="270" height="44" rx="9" ry="9" fill="#1F918C"/><text x="585.0" y="212.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="585.0" dy="0">result placed in rax</tspan></text><rect x="60" y="190" width="270" height="44" rx="9" ry="9" fill="#55637A"/><text x="195.0" y="212.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="195.0" dy="0">check rax; negative = -errno</tspan></text><line x1="450" y1="212" x2="330" y2="212" stroke="#6B7B94" stroke-width="2" marker-end="url(#ah-g)"/><text x="390" y="202" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">sysret</text><line x1="585" y1="146" x2="585" y2="190" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="390.0" y="304" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">syscall is far cheaper than the legacy int 0x80 — it uses MSRs, not the IDT</text></svg>
