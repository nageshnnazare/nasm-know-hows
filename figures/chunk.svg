<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Chunk</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="360.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">A glibc chunk: in-use vs free</text><text x="170" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">allocated</text><rect x="40" y="76" width="260" height="40" rx="3" ry="3" fill="#55637A"/><text x="170.0" y="96.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">prev_size</tspan></text><rect x="40" y="120" width="260" height="40" rx="3" ry="3" fill="#3E7CC0"/><text x="170.0" y="140.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">size | A M P</tspan></text><rect x="40" y="164" width="260" height="40" rx="3" ry="3" fill="#1F918C"/><text x="170.0" y="184.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">payload  ← malloc returns here</tspan></text><rect x="40" y="208" width="260" height="40" rx="3" ry="3" fill="#6B7B94"/><text x="170.0" y="228.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="170.0" dy="0">… padding to 16B</tspan></text><text x="550" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">free (in a bin)</text><rect x="420" y="76" width="260" height="40" rx="3" ry="3" fill="#55637A"/><text x="550.0" y="96.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="550.0" dy="0">prev_size</tspan></text><rect x="420" y="120" width="260" height="40" rx="3" ry="3" fill="#3E7CC0"/><text x="550.0" y="140.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="550.0" dy="0">size | A 0 P</tspan></text><rect x="420" y="164" width="260" height="40" rx="3" ry="3" fill="#D9922B"/><text x="550.0" y="184.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="550.0" dy="0">fd  (next free)</tspan></text><rect x="420" y="208" width="260" height="40" rx="3" ry="3" fill="#D9922B"/><text x="550.0" y="228.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="550.0" dy="0">bk  (prev free)</tspan></text><text x="360.0" y="346" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">16 B of metadata per allocation; free chunks store fd/bk inside the old payload</text></svg>
