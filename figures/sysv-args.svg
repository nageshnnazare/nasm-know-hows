<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>SysV arguments</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">System V AMD64: how arguments are passed</text><rect x="40" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="98.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="98.0" dy="0">rdi</tspan><tspan x="98.0" dy="15">arg 1</tspan></text><rect x="168" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="226.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="226.0" dy="0">rsi</tspan><tspan x="226.0" dy="15">arg 2</tspan></text><rect x="296" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="354.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="354.0" dy="0">rdx</tspan><tspan x="354.0" dy="15">arg 3</tspan></text><rect x="424" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="482.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="482.0" dy="0">rcx</tspan><tspan x="482.0" dy="15">arg 4</tspan></text><rect x="552" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="610.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="610.0" dy="0">r8</tspan><tspan x="610.0" dy="15">arg 5</tspan></text><rect x="680" y="74" width="116" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="738.0" y="92.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="738.0" dy="0">r9</tspan><tspan x="738.0" dy="15">arg 6</tspan></text><text x="410.0" y="162" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">args 7+  →  pushed on the stack, right to left</text><rect x="300" y="188" width="220" height="44" rx="9" ry="9" fill="#1F918C"/><text x="410.0" y="210.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="410.0" dy="0">return value  →  rax</tspan></text><text x="410.0" y="304" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">rdx can return a second word; for varargs, al holds the vector-register count</text></svg>
