<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Memory hierarchy</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="530.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">The memory hierarchy — latency vs capacity</text><rect x="60" y="52" width="170" height="40" rx="6" ry="6" fill="#3E7CC0"/><text x="145.0" y="72.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="145.0" dy="0">registers</tspan></text><text x="244" y="72" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~1 cycle   ·   &lt; 1 KiB</text><rect x="60" y="102" width="250" height="40" rx="6" ry="6" fill="#3E7CC0"/><text x="185.0" y="122.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="185.0" dy="0">L1 cache</tspan></text><text x="324" y="122" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~4 cycles / ~1 ns   ·   32 KiB / core</text><rect x="60" y="152" width="340" height="40" rx="6" ry="6" fill="#6B7B94"/><text x="230.0" y="172.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="230.0" dy="0">L2 cache</tspan></text><text x="414" y="172" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~12 cycles / ~3 ns   ·   256 KiB–1 MiB</text><rect x="60" y="202" width="430" height="40" rx="6" ry="6" fill="#6B7B94"/><text x="275.0" y="222.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="275.0" dy="0">L3 cache</tspan></text><text x="504" y="222" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~40 cycles / ~10 ns   ·   8–32 MiB</text><rect x="60" y="252" width="540" height="40" rx="6" ry="6" fill="#55637A"/><text x="330.0" y="272.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="330.0" dy="0">DRAM</tspan></text><text x="614" y="272" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~200 cycles / ~80 ns   ·   many GiB</text><rect x="60" y="302" width="620" height="40" rx="6" ry="6" fill="#55637A"/><text x="370.0" y="322.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">NVMe SSD</tspan></text><text x="694" y="322" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~10 µs   ·   TiB</text><rect x="60" y="352" width="700" height="40" rx="6" ry="6" fill="#9AA0B4"/><text x="410.0" y="372.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="410.0" dy="0">spinning disk</tspan></text><text x="774" y="372" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">~10 ms   ·   TiB</text><text x="530.0" y="416" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">smaller &amp; faster at the top — locality keeps you near the top</text></svg>
