<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>SIMD registers</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">SIMD registers: XMM ⊆ YMM ⊆ ZMM</text><rect x="60" y="72" width="700" height="44" rx="3" ry="3" fill="#6B7B94"/><text x="410.0" y="94.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="410.0" dy="0">ZMM0  (512-bit, AVX-512)</tspan></text><rect x="60" y="120" width="350" height="42" rx="3" ry="3" fill="#3E7CC0"/><text x="235.0" y="141.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="235.0" dy="0">YMM0  (256-bit, AVX)</tspan></text><rect x="60" y="166" width="175" height="40" rx="3" ry="3" fill="#1F918C"/><text x="147.5" y="186.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="147.5" dy="0">XMM0  (128-bit, SSE)</tspan></text><text x="60" y="232" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="central">one XMM as 4 packed float32 lanes:</text><rect x="60" y="246" width="88" height="40" rx="9" ry="9" fill="#D9922B"/><text x="104.0" y="266.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="104.0" dy="0">f0</tspan></text><rect x="152" y="246" width="88" height="40" rx="9" ry="9" fill="#D9922B"/><text x="196.0" y="266.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="196.0" dy="0">f1</tspan></text><rect x="244" y="246" width="88" height="40" rx="9" ry="9" fill="#D9922B"/><text x="288.0" y="266.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="288.0" dy="0">f2</tspan></text><rect x="336" y="246" width="88" height="40" rx="9" ry="9" fill="#D9922B"/><text x="380.0" y="266.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">f3</tspan></text><text x="410.0" y="306" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">one instruction (addps) adds all four lanes at once — data-level parallelism</text></svg>
