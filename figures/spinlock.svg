<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Spinlock</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">A spinlock is one atomic compare-exchange</text><rect x="50" y="78" width="217" height="135" rx="11" ry="11" fill="#232A35" stroke="#55637A" stroke-width="1.75"/><text x="64" y="93" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="start" dominant-baseline="central">SPIN</text><text x="64" y="115.5" fill="#8892A5" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">acquire:</text><text x="64" y="134.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  xor eax, eax   ; want 0</text><text x="64" y="153.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  mov ecx, 1</text><text x="64" y="172.5" fill="#7FC4FF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  lock cmpxchg [lk], ecx</text><text x="64" y="191.5" fill="#D7DCE6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" text-anchor="start" dominant-baseline="central" xml:space="preserve">  jnz acquire     ; retry</text><rect x="323" y="96" width="230" height="50" rx="9" ry="9" fill="#1F918C"/><text x="438.0" y="113.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="438.0" dy="0">success → we own it</tspan><tspan x="438.0" dy="15">(ZF=1, lock was 0)</tspan></text><rect x="323" y="166" width="230" height="50" rx="9" ry="9" fill="#D9922B"/><text x="438.0" y="183.5" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="438.0" dy="0">fail → spin again</tspan><tspan x="438.0" dy="15">(someone else holds it)</tspan></text><line x1="273" y1="118" x2="323" y2="121" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="273" y1="138" x2="323" y2="191" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="390.0" y="284" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">cmpxchg is atomic under the lock prefix; a futex lets waiters sleep instead of burning CPU</text></svg>
