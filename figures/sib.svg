<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>SIB byte</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="340.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">The SIB byte (scaled-index addressing)</text><rect x="60" y="78" width="180" height="60" rx="9" ry="9" fill="#D9922B"/><text x="150.0" y="100.0" fill="#1F2433" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="150.0" dy="0">scale  (2 bits)</tspan><tspan x="150.0" dy="16">1 2 4 8</tspan></text><rect x="248" y="78" width="180" height="60" rx="9" ry="9" fill="#1F918C"/><text x="338.0" y="100.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="338.0" dy="0">index  (3 bits)</tspan><tspan x="338.0" dy="16">index register</tspan></text><rect x="436" y="78" width="180" height="60" rx="9" ry="9" fill="#6B7B94"/><text x="526.0" y="100.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="526.0" dy="0">base  (3 bits)</tspan><tspan x="526.0" dy="16">base register</tspan></text><text x="340.0" y="206" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">present only when r/m=100; encodes [base + index*scale] like [rbx + rsi*4]</text></svg>
