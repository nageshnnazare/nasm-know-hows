<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>RFLAGS</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="440.0" y="28" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">RFLAGS — the status bits that drive branches</text><rect x="40" y="72" width="88" height="50" rx="9" ry="9" fill="#1F918C"/><text x="84.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="84.0" dy="0">OF</tspan></text><text x="84.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 11</text><rect x="130" y="72" width="88" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="174.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="174.0" dy="0">DF</tspan></text><text x="174.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 10</text><rect x="220" y="72" width="88" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="264.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="264.0" dy="0">IF</tspan></text><text x="264.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 9</text><rect x="310" y="72" width="88" height="50" rx="9" ry="9" fill="#55637A"/><text x="354.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="354.0" dy="0">TF</tspan></text><text x="354.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 8</text><rect x="400" y="72" width="88" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="444.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="444.0" dy="0">SF</tspan></text><text x="444.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 7</text><rect x="490" y="72" width="88" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="534.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="534.0" dy="0">ZF</tspan></text><text x="534.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 6</text><rect x="580" y="72" width="88" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="624.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="624.0" dy="0">AF</tspan></text><text x="624.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 4</text><rect x="670" y="72" width="88" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="714.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="714.0" dy="0">PF</tspan></text><text x="714.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 2</text><rect x="760" y="72" width="88" height="50" rx="9" ry="9" fill="#3E7CC0"/><text x="804.0" y="97.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="804.0" dy="0">CF</tspan></text><text x="804.0" y="62" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">bit 0</text><text x="60" y="150" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• CF  carry / unsigned overflow</text><text x="490" y="150" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• ZF  result was zero</text><text x="60" y="174" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• SF  sign (top bit) of result</text><text x="490" y="174" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• OF  signed overflow</text><text x="60" y="198" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• PF  low-byte parity</text><text x="490" y="198" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• AF  BCD adjust carry</text><text x="60" y="222" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• DF  string direction (0 = up)</text><text x="490" y="222" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central">• IF  interrupts enabled</text></svg>
